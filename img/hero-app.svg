    <text x="52" y="392" font-size="11" fill="#5B7A62">cigarrillos</text>
    <text x="52" y="407" font-size="11" fill="#5B7A62">evitados</text>
    <rect x="176" y="336" width="128" height="86" rx="18" fill="#12301B"/>
