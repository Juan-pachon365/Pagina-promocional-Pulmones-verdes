    <circle cx="170" cy="230" r="78" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="150" transform="rotate(-90 170 230)"/>
    <text x="170" y="226" font-size="42" font-weight="700" fill="#12301B" text-anchor="middle">12</text>
    <text x="170" y="252" font-size="13" fill="#5B7A62" text-anchor="middle">días sin fumar</text>
    <rect x="36" y="336" width="128" height="86" rx="18" fill="#FFFFFF" stroke="#DCEFD8"/>
