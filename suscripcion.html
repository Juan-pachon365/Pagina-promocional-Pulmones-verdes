<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suscríbete | Pulmones Verdes</title>
  <meta name="description" content="Suscríbete a Pulmones Verdes y recibe en tu correo consejos y mensajes de ánimo para dejar el cigarrillo.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pulmonesverdeslanding.vercel.app/suscripcion.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2E7D32">
  <link rel="preload" href="fonts/poppins-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding-top: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 85% 15%, rgba(123,211,137,.35), transparent 45%), radial-gradient(circle at 10% 90%, rgba(246,196,83,.18), transparent 40%), var(--fondo-claro); }
    .tarjeta { width: 100%; max-width: 480px; margin: 24px 16px; background: #fff; border-radius: 24px; padding: 40px 32px; box-shadow: var(--sombra); text-align: center; }
    .tarjeta .logo { width: 56px; height: 56px; margin-bottom: 12px; }
    .tarjeta h1 { font-size: 1.8rem; margin: 0 0 8px; }
    .tarjeta > p { color: var(--gris); margin: 0 0 24px; }
    .campo { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .campo label { font-weight: 700; color: var(--verde-oscuro); font-size: .95rem; }
    .campo input { font: inherit; padding: 14px 16px; border: 1px solid #CFE3CC; border-radius: 12px; width: 100%; }
    .campo input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 4px rgba(46,125,50,.15); }
    .campo button { font: inherit; font-weight: 700; cursor: pointer; padding: 14px 28px; }
    .campo button:disabled { opacity: .7; cursor: wait; }
    .estado { min-height: 1.5em; margin: 16px 0 0; font-weight: 700; }
    .estado.ok { color: var(--verde); }
    .estado.error { color: #B3261E; }
    .volver { display: inline-block; margin-top: 20px; color: var(--verde-oscuro); font-weight: 700; text-decoration: none; }
    .volver:hover { color: var(--verde); }
  </style>
</head>
<body>
  <main class="tarjeta">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 4v18" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 13C10 9 3 17 5 30c1 5 9 5 12 0 2-5 2-11 1-17z" fill="#43A047"/>
      <path d="M22 13c8-4 15 4 13 17-1 5-9 5-12 0-2-5-2-11-1-17z" fill="#81C784"/>
    </svg>
    <h1>Únete a Pulmones Verdes</h1>
    <p>Déjanos tu correo y te enviamos la bienvenida con todo lo que necesitas para empezar tu reto.</p>

    <form id="form-suscripcion" class="campo" novalidate>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      <button type="submit" class="btn btn-verde" id="btn-enviar">Suscribirme</button>
    </form>
    <p class="estado" id="estado" role="status" aria-live="polite"></p>

    <a href="./" class="volver">← Volver a la página principal</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
  <script>
    /* ===== Configuración de EmailJS: reemplaza estos 3 valores ===== */
    const EMAILJS_PUBLIC_KEY = 'TU_PUBLIC_KEY';
    const EMAILJS_SERVICE_ID = 'TU_SERVICE_ID';
    const EMAILJS_TEMPLATE_ID = 'TU_TEMPLATE_ID';

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const form = document.getElementById('form-suscripcion');
    const input = document.getElementById('email');
    const boton = document.getElementById('btn-enviar');
    const estado = document.getElementById('estado');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = input.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        estado.className = 'estado error';
        estado.textContent = 'Escribe un correo válido.';
        input.focus();
        return;
      }
      boton.disabled = true;
      boton.textContent = 'Enviando…';
      estado.className = 'estado';
      estado.textContent = '';

      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { email: email })
        .then(function () {
          estado.className = 'estado ok';
          estado.textContent = '¡Listo! Revisa tu bandeja de entrada 🌱';
          form.reset();
          if (window.dataLayer) window.dataLayer.push({ event: 'suscripcion_email' });
        })
        .catch(function (err) {
          console.error('EmailJS:', err);
          estado.className = 'estado error';
          estado.textContent = 'No pudimos enviar el correo. Intenta de nuevo.';
        })
        .finally(function () {
          boton.disabled = false;
          boton.textContent = 'Suscribirme';
        });
    });
  </script>
</body>
</html>
